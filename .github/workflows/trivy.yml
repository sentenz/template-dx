# SPDX-License-Identifier: Apache-2.0

name: Trivy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [created]

permissions: {}

jobs:
  trivy-fs-scan:
    name: Trivy Action | Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy Filesystem Scan
        uses: sentenz/actions/trivy@1f71880fdb530642b617b45d42caa289c9d6d042 # 1.5.1
        with:
          scan-type: fs
          scan-target: "."
          format: sarif
          output: trivy-results.sarif

      - name: Upload results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: false

  trivy-config-scan:
    name: Trivy Action | Configuration Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy Config Scan
        uses: sentenz/actions/trivy@1f71880fdb530642b617b45d42caa289c9d6d042 # 1.5.1
        with:
          scan-type: config
          scan-target: "."
          format: sarif
          output: trivy-iac.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy Config Scan
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-iac.sarif
        continue-on-error: false

  trivy-license-compliance:
    name: Trivy Action | License Compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run License Compliance Scan
        uses: sentenz/actions/trivy@1f71880fdb530642b617b45d42caa289c9d6d042 # 1.5.1
        with:
          scan-type: fs
          scan-target: "."
          scanners: license
          format: table
          severity: UNKNOWN,HIGH,CRITICAL
        continue-on-error: false
