# SPDX-License-Identifier: Apache-2.0

name: Regal

on:
  push:
    branches:
      - main
    paths:
      - "**/*.rego"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.rego"

permissions: {}

jobs:
  regal:
    name: Regal Action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Regal
        uses: sentenz/actions/regal@23361c53dc10a0980b449d78bb4481e4997da7d3 # 1.7.1
        with:
          path: "./tests/policy"
          regal-version: "latest"
