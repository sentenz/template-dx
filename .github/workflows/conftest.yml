# SPDX-License-Identifier: Apache-2.0

name: Conftest

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  conftest:
    name: Conftest Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Conftest
        uses: sentenz/actions/conftest@edd5e1e574e3eaa1254fbd19f4d2f0a5854c574d # 1.2.1
        with:
          policy-path: "./tests/policy"
