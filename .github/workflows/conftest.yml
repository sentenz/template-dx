# SPDX-License-Identifier: Apache-2.0

name: Conftest

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  conftest:
    name: Conftest Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Conftest
        uses: sentenz/actions/conftest@bceed480720a7bc304e974cd655ebe42ac41d5e2 # 1.1.9
        with:
          policy-path: "./tests/policy"
