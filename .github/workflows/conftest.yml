# SPDX-License-Identifier: Apache-2.0

name: Conftest

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  conftest:
    name: Conftest Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Conftest
        uses: sentenz/actions/conftest@ec5ca4ca09c4a45e5583cb88dd361381c1a62f62 # 1.1.6
        with:
          policy-path: "./tests/policy"
